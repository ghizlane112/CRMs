{% include 'parts/nav.html' %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/main.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.10.1/locales/fr.js'></script>

    <style>
        .right-side {
            background-color: #F6F2F2;
            border-radius: 15px;
            height: auto;
            width: 81%;
            position: absolute;
            top: 131px;
            left: 17.5%;
            overflow: hidden;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2),
                        4px 4px 10px rgba(0, 0, 0, 0.4),
                        6px 6px 15px rgba(0, 0, 0, 0.6);
        }
          /* Text */
        .right-side h1{
            color: #3837D3;
            font-family: 'Inter';
            font-style:  Bold italic;
            font-weight: 600;
            font-size: 32px;
            line-height: 20px;
        }

        .right-side-calendar {
            position: relative;
            top: 23px;
            left: 15px;
            right: 5px;
        }
        #calendar {
            width: 96%;
            background-color: white;
        }
        /* Style pour la fenêtre modale */
        #eventModal{
        z-index: 2;


        }


        #eventModal {
            display: none; /* Masqué par défaut */
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Fond semi-transparent */
            justify-content: center;
            align-items: center;
        }
        #eventModalContent {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="left-side">
        {% include 'parts/button.html' %}
    </div>

    <div class="right-side">
    <h1>Appoitement</h1>
    <div class="right-side-calendar">
<!-- Modal pour ajouter/modifier un événement -->
<div id="eventModal">
    <div id="eventModalContent">
        <h2 id="eventModalTitle">Ajouter un événement</h2>
        <form id="eventForm">
            <label for="title">Titre:</label>
            <input type="text" id="title" name="title" required><br>
            <label for="heur">Heure:</label>
            <input type="time" id="heur" name="heur" required><br>
            <label for="description">Description:</label>
            <textarea id="description" name="description"></textarea><br>
            <button type="submit" id="saveEventBtn">Enregistrer</button>
            <button type="button" id="deleteEventBtn" style="display: none;">Supprimer</button>
            <button type="button" id="cancelBtn">Annuler</button>
        </form>
    </div>
</div>

            <div id='calendar'></div>
        </div>
    </div>

   
    <script>
     document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const modal = document.getElementById('eventModal');
            const form = document.getElementById('eventForm');
            const saveEventBtn = document.getElementById('saveEventBtn');
            const deleteEventBtn = document.getElementById('deleteEventBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const eventModalTitle = document.getElementById('eventModalTitle');
            
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'fr',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek,timeGridDay'
                },
                editable: true,
                selectable: true,
                events: '/events/',

                dateClick: function(info) {
                    form.reset();
                    eventModalTitle.textContent = 'Ajouter un événement';
                    form.dataset.action = 'add';
                    form.removeAttribute('data-event-id');
                    deleteEventBtn.style.display = 'none';

                    saveEventBtn.textContent = 'Ajouter';
                    modal.style.display = 'flex';

                    cancelBtn.onclick = function() {
                        modal.style.display = 'none';
                    };

                    form.onsubmit = function(e) {
                        e.preventDefault();
                        const title = document.getElementById('title').value;
                        const heur = document.getElementById('heur').value;
                        const description = document.getElementById('description').value;
                        const action = form.dataset.action;
                        const url = action === 'add' ? '/add-event/' : '/update-event/';

                        if (title && heur) {
                            fetch(url, {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/x-www-form-urlencoded',
                                    'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                                },
                                body: new URLSearchParams({
                                    id: form.dataset.eventId || '',
                                    title: title,
                                    start_date: info.dateStr,
                                    heur: heur,
                                    description: description
                                })
                            })
                            .then(response => response.json())
                            .then(data => {
                                if (data.status === 'success') {
                                    calendar.refetchEvents();
                                    modal.style.display = 'none';
                                } else {
                                    console.error('Erreur:', data.message);
                                }
                            })
                            .catch(error => {
                                console.error('Erreur:', error);
                            });
                        } else {
                            alert('Veuillez remplir tous les champs obligatoires.');
                        }
                    };
                },

                eventClick: function(info) {
                    eventModalTitle.textContent = 'Modifier l\'événement';
                    form.dataset.action = 'update';
                    form.dataset.eventId = info.event.id;

                    document.getElementById('title').value = info.event.title;
                    document.getElementById('heur').value = info.event.extendedProps.heur;
                    document.getElementById('description').value = info.event.extendedProps.description;

                    saveEventBtn.textContent = 'Modifier';
                    deleteEventBtn.style.display = 'inline-block';
                    deleteEventBtn.onclick = function() {
                        fetch('/delete-event/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/x-www-form-urlencoded',
                                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').getAttribute('content')
                            },
                            body: new URLSearchParams({
                                id: form.dataset.eventId
                            })
                        })
                        .then(response => response.json())
                        .then(data => {
                            if (data.status === 'success') {
                                calendar.refetchEvents();
                                modal.style.display = 'none';
                            } else {
                                console.error('Erreur:', data.message);
                            }
                        })
                        .catch(error => {
                            console.error('Erreur:', error);
                        });
                    };

                    cancelBtn.onclick = function() {
                        modal.style.display = 'none';
                    };

                    modal.style.display = 'flex';
                }
            });

            calendar.render();
        });

    </script>
</body>
</html>
