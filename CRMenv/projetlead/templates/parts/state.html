
<!DOCTYPE html>
<head>

<!-- FullCalendar CSS -->
<link href='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.11.2/main.min.css' rel='stylesheet' />
<!-- FullCalendar JS -->
<script src='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.11.2/main.min.js'></script>


<style>
#first-card{
width: 592px;
height: 187px;
color: white;
background-color: #3D46F2;
border-radius: 17px;
font-style: Inter;
position: relative;
top:9px;
left:23px;
}
#first-card h2{
  
    margin-left: 11px;
}
#first-card img{
width: 242px;
float: right;
position: relative;
bottom: 100px;
margin-right: -19px;
}

#first-card .card-text{
width: 269px;
margin-left: 11px;
font-size: 14px;

}
#second-card{
border-radius: 17px;
/*border-color: rgba(71, 71, 71, 0.721);
border-style: dotted;*/
width: 359px;
height: 312px;
float: right;
position: relative;
top:-300px;
right: 30px;

}
#calendar {
            width: 349px; /* Largeur du calendrier */
            height: 312px; /* Hauteur du calendrier */
            background-color: #ffffff; /* Fond blanc */
            margin: 0 auto; /* Centre le calendrier horizontalement */
            border: 1px solid #ddd; /* Bordure légère pour mieux voir le calendrier */
            border-radius: 8px; /* Coins arrondis */
            border-radius: 17px;
        }
        .fc-toolbar-title {
            font-size: 1em; /* Taille du titre du calendrier, ajustez si nécessaire */
        }
        .fc-daygrid-day-number {
            font-size: 0.8em; /* Taille du texte des jours, ajustez si nécessaire */
        }

#second-card   .card-body{
 position: relative;
 right: 85px;
 
}     
</style>
</head>
<body>
<div class="row">
<div class="col">
<div class="col-md">
    <!---premier card-->
   <div class="card text-center text-white mb-3" id="first-card" >
    <div class="card-body" style="width: 33rem;">
        <br>
        <h2 class="card-title">Welcome  {{ user.username }} </h2>
        <br>
        <p class="card-text">"Bienvenue sur votre tableau de bord : ici, vous pouvez suivre en un coup d'œil vos leads, rendez-vous et activités récentes pour une gestion efficace de vos prospects.".</p>
        {%load static%}
        <img src="{%static 'images/rectangle_2067.png'%}" alt="photo principale"/>
      </div>
    </div>


    <!----deuxieme card--->
    <a href="{% url 'calendar_view' %}" class="calendar-link">
    <div class="card text-center text-white mb-3" id="second-card">
        <div class="card-body" style="width: 33rem;">
        
                <div id="calendar"></div>
        
          </div>
    </div>
    </a>




    <!----troisieme card-->
    <div class="card text-center text-white mb-3" id="thrid-card">
        <div class="card-body" style="width: 33rem;">
          
           
        
        </div>
    </div>






</div>
</div>
</div>









<script src='https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/5.11.2/main.min.js'></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        var calendarEl = document.getElementById('calendar');

        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            events: '/events/',  // URL de votre endpoint Django pour les événements
            eventClick: function(info) {
                alert('Event: ' + info.event.title + '\nDescription: ' + info.event.extendedProps.description + '\nDate: ' + info.event.start.toISOString());
            }
        });

        calendar.render();
    });
</script>

</body>
</html>
