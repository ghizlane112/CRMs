

<!DOCTYPE html>
<html>
<head>
    <title>Calendrier</title>
    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.0.2/main.min.css" rel="stylesheet" />
    <!-- FullCalendar JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.0.2/main.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.0.2/locales/fr.min.js"></script> <!-- Optionnel : pour les traductions en français -->
</head>
<body>
    <h1>Calendrier</h1>
    <div id="calendar"></div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'fr', // Optionnel : pour le français
                events: '/events/', // URL pour récupérer les événements
            });
            calendar.render();
        });
    </script>
</body>
</html
